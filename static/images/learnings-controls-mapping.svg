<svg viewBox="0 0 1200 612" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Five lab learnings mapped to existing ISO 27001, ISO/IEC 42001 and EU AI Act controls</title>

  <!-- Title -->
  <text x="40" y="36" fill="#1A1A2E" font-size="22" font-weight="700">Agent governance maps onto controls you already run</text>
  <text x="40" y="58" fill="#4A5470" font-size="12" font-style="italic">Five things from running the lab — and the ISO 27001, ISO/IEC 42001 and EU AI Act controls each one already lives in.</text>

  <!-- Column header bar -->
  <rect x="40" y="76" width="1120" height="28" fill="#1A1A2E"/>
  <text x="64" y="95" fill="#FFFFFF" font-size="11" letter-spacing="2" font-weight="600">LEARNING FROM THE LAB</text>
  <text x="544" y="95" fill="#FFFFFF" font-size="11" letter-spacing="2" font-weight="600">MAPS ONTO CONTROLS YOU ALREADY RUN</text>

  <!-- Column divider -->
  <line x1="520" y1="104" x2="520" y2="568" stroke="#D8DBE2" stroke-width="1"/>

  <!-- ROW 1 -->
  <rect x="40" y="104" width="1120" height="88" fill="#F5F6F8"/>
  <circle cx="70" cy="138" r="17" fill="#00AEEF"/>
  <text x="70" y="144" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">1</text>
  <text x="104" y="134" fill="#1A1A2E" font-size="15" font-weight="700">Token runaway is a containment failure</text>
  <text x="104" y="156" fill="#4A5470" font-size="12">Budget per role at the harness layer; alarm and log every overrun.</text>
  <rect x="544" y="130" width="8" height="8" fill="#00AEEF"/>
  <text x="562" y="138" fill="#1A1A2E" font-size="12.5">ISO 27001 <tspan font-weight="700">A.8.6</tspan> — Capacity management</text>
  <rect x="544" y="156" width="8" height="8" fill="#00AEEF"/>
  <text x="562" y="164" fill="#1A1A2E" font-size="12.5">ISO/IEC 42001 — Resource handling for AI systems</text>

  <!-- ROW 2 -->
  <rect x="40" y="192" width="1120" height="88" fill="#FFFFFF"/>
  <circle cx="70" cy="226" r="17" fill="#00AEEF"/>
  <text x="70" y="232" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">2</text>
  <text x="104" y="222" fill="#1A1A2E" font-size="15" font-weight="700">Model selection is a policy decision</text>
  <text x="104" y="244" fill="#4A5470" font-size="12">Document why each role uses which model — as a control.</text>
  <rect x="544" y="231" width="8" height="8" fill="#00AEEF"/>
  <text x="562" y="239" fill="#1A1A2E" font-size="12.5">ISO 27001 <tspan font-weight="700">A.8.27</tspan> — Secure system architecture &amp; engineering</text>

  <!-- ROW 3 -->
  <rect x="40" y="280" width="1120" height="88" fill="#F5F6F8"/>
  <circle cx="70" cy="314" r="17" fill="#00AEEF"/>
  <text x="70" y="320" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">3</text>
  <text x="104" y="304" fill="#1A1A2E" font-size="15" font-weight="700">Agents must not grade themselves</text>
  <text x="104" y="326" fill="#4A5470" font-size="12">Separate the generator from the evaluator; a human signs off.</text>
  <rect x="544" y="296" width="8" height="8" fill="#00AEEF"/>
  <text x="562" y="304" fill="#1A1A2E" font-size="12.5">ISO 27001 <tspan font-weight="700">A.5.3</tspan> — Segregation of duties</text>
  <rect x="544" y="320" width="8" height="8" fill="#00AEEF"/>
  <text x="562" y="328" fill="#1A1A2E" font-size="12.5">EU AI Act <tspan font-weight="700">Art. 14</tspan> — Human oversight</text>
  <rect x="544" y="344" width="8" height="8" fill="#00AEEF"/>
  <text x="562" y="352" fill="#1A1A2E" font-size="12.5">ISO/IEC 42001 — Use of AI systems</text>

  <!-- ROW 4 -->
  <rect x="40" y="368" width="1120" height="88" fill="#FFFFFF"/>
  <circle cx="70" cy="402" r="17" fill="#00AEEF"/>
  <text x="70" y="408" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">4</text>
  <text x="104" y="398" fill="#1A1A2E" font-size="15" font-weight="700">Boundaries are the spec, not the prompt</text>
  <text x="104" y="420" fill="#4A5470" font-size="12">Enumerate every permission in a file you can audit.</text>
  <rect x="544" y="407" width="8" height="8" fill="#00AEEF"/>
  <text x="562" y="415" fill="#1A1A2E" font-size="12.5">ISO 27001 <tspan font-weight="700">A.5.15</tspan> — Access control</text>

  <!-- ROW 5 -->
  <rect x="40" y="456" width="1120" height="88" fill="#F5F6F8"/>
  <circle cx="70" cy="490" r="17" fill="#00AEEF"/>
  <text x="70" y="496" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">5</text>
  <text x="104" y="480" fill="#1A1A2E" font-size="15" font-weight="700">Every fleet needs two custodians</text>
  <text x="104" y="502" fill="#4A5470" font-size="12">A security observer and an ops agent, each able to interrupt.</text>
  <rect x="544" y="472" width="8" height="8" fill="#00AEEF"/>
  <text x="562" y="480" fill="#1A1A2E" font-size="12.5">ISO 27001 <tspan font-weight="700">A.5.24 / A.8.16</tspan> — Monitoring &amp; incident management</text>
  <rect x="544" y="498" width="8" height="8" fill="#00AEEF"/>
  <text x="562" y="506" fill="#1A1A2E" font-size="12.5">ISO 22301 — Incident response structure</text>

  <!-- bottom rule + caption -->
  <line x1="40" y1="544" x2="1160" y2="544" stroke="#1A1A2E" stroke-width="2"/>
  <text x="40" y="568" fill="#4A5470" font-size="11" font-style="italic">The discipline of running AI agents well is older than the technology — it lives in the standards practitioners have used for a decade.</text>
</svg>
