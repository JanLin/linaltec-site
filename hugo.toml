      description = "Konsulttjänster inom cybersäkerhet och dataskydd — ISO 27001-certifiering, vCISO och styrning av AI-agenter."

    # Resources and Tools are English-only; entries marked crossLang = true link
    # across to the English sections (rendered without the /sv/ language prefix)
    # rather than exposing empty Swedish list pages.
