baseURL = "https://janlin.github.io/linaltec-site/"
title = "Linaltec AB"
theme = "PaperMod"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[pagination]
  pagerSize = 10

[params]
  description = "Cybersecurity & Privacy Consulting — ISO 27001 certification, vCISO, and AI agent governance."
  author = "Jan Lindquist"
  defaultTheme = "light"
  displayFullLangName = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  images = ["images/og-card.png"]

  [params.label]
    text = ""
    icon = "images/logo.png"
    iconHeight = 35

  [params.schema]
    publisherType = "Organization"
    sameAs = ["https://www.linkedin.com/in/janlindquist/"]

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/janlindquist/"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:jan@linaltec.com"

[languages]
  [languages.en]
    languageCode = "en-GB"
    languageName = "English"
    weight = 1
    title = "Linaltec AB"
    [languages.en.params]
      description = "Cybersecurity & Privacy Consulting — ISO 27001 certification, vCISO, and AI agent governance."

    [[languages.en.menu.main]]
      identifier = "services"
      name = "Services"
      url = "services/"
      weight = 10

    [[languages.en.menu.main]]
      identifier = "tools"
      name = "Tools"
      url = "tools/"
      weight = 20

